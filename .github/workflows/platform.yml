name: BirdView platform
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.25.0}
      - uses: actions/setup-node@v4
        with: {node-version: 24.19.0, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm platform:lint && pnpm platform:types && pnpm test && pnpm build
      - name: Real PostgreSQL and Redis
        run: |
          node scripts/init-local-env.mjs
          docker compose -f compose.infra.yml up -d --wait
          pnpm platform:migrate
          pnpm platform:seed
          pnpm platform:test:prepare
      - name: Chromium compatible with Playwright
        run: |
          pnpm exec playwright install --with-deps chromium
          node --input-type=module -e 'import { chromium } from "@playwright/test"; import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + chromium.executablePath() + "\n");'
      - run: pnpm platform:test
      - name: Browser end to end
        run: |
          pnpm platform:dev > /tmp/birdview-dev.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:5174/api/v1/config > /dev/null; then break; fi
            sleep 1
          done
          pnpm platform:e2e
      - name: Dependency report
        run: pnpm audit --prod --json > dependency-audit.json
      - name: Free static browser demo, without API requests
        run: |
          BIRDVIEW_BROWSER_DEMO=1 pnpm platform:build
          pnpm --filter @birdview/web exec vite preview --port 4177 --host 127.0.0.1 > /tmp/birdview-static.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4177/app/ > /dev/null; then break; fi
            sleep 1
          done
          pnpm platform:e2e:static
      - name: Build deployable images
        run: docker compose build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: birdview-validation
          path: |
            docs/platform/captures
            docs/platform/browser-demo-captures
            dependency-audit.json
